name: Windows local release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build platform (Linux calls the build-only reusable workflow)
        required: true
        default: windows
        type: choice
        options:
          - windows
          - linux
      ref:
        description: Git ref containing the local Windows changes
        required: true
        default: local/macos-integration
        type: string
      release_tag:
        description: Existing GitHub release tag to receive the Windows assets
        required: true
        default: v0.7.2-local.1
        type: string
      upload_release:
        description: Upload to an existing local release after acceptance
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    if: ${{ inputs.platform != 'linux' }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout local fork
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Validate local version and release scope
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -notmatch "^v$([regex]::Escape($version))-local\.[0-9]+$") {
            throw "Release must be a local tag matching the checked-out package version"
          }
          node scripts/validate-version.js

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,wasm32-unknown-unknown

      - name: Ensure WASM target
        shell: pwsh
        run: rustup target add wasm32-unknown-unknown

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Install wasm-bindgen
        shell: pwsh
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Build local Windows NSIS package
        shell: pwsh
        run: pnpm exec tauri build --config src-tauri/tauri.local-windows.conf.json --target x86_64-pc-windows-msvc --bundles nsis

      - name: Package portable ZIP
        shell: pwsh
        env:
          RUST_TARGET: x86_64-pc-windows-msvc
        run: node scripts/package-windows-portable.js

      - name: Upload Windows assets to the local release
        if: ${{ inputs.upload_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $setup = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          $portable = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/portable" -Filter "*-portable.zip" | Select-Object -First 1
          if ($null -eq $setup -or $null -eq $portable) {
            throw "Windows release assets were not produced"
          }
          gh release upload $env:RELEASE_TAG $setup.FullName $portable.FullName --repo $env:GITHUB_REPOSITORY --clobber

      - name: Upload build artifacts for troubleshooting
        uses: actions/upload-artifact@v4
        with:
          name: dashbeam-windows-local
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/portable/*portable.zip

  build-linux:
    if: ${{ inputs.platform == 'linux' }}
    permissions:
      contents: read
    uses: ./.github/workflows/linux-local-release.yml
    with:
      ref: ${{ inputs.ref }}
